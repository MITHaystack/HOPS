name: Release binary distribution

# Builds the redistributable HOPS binary distribution (CPack TGZ), gated on the
# test suite passing, and attaches it to the GitHub Release when a v* tag is
# pushed. A manual run (workflow_dispatch) produces the tarball as a downloadable
# workflow artifact without creating a release (useful for dry-runs).
#
# tests are disabled for now since most of them require HOPS3 for comparison

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write          # required to create the release and upload assets

env:
  BUILD_TYPE: Release
  # DiFX / difxio is built from source below (difxio only)
  DIFXROOT: ${{ github.workspace }}/difx-install

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake cmake-curses-gui python3-dev python3-pip wget jq \
            autoconf automake libtool pkg-config
          # NOTE: gnuplot is intentionally NOT installed here - it is only a
          # runtime dependency of the matplot++ plotter, not needed to build it.
      # Test-only python deps. Installed into an external --target dir (not the
      # HOPS install prefix) so the packaged tarball stays "deps off"; --target
      # also sidesteps PEP-668 "externally-managed" pip on ubuntu-24.04.
      - name: Install python test dependencies
        run: |
          python3 -m pip install --target="$RUNNER_TEMP/pydeps" -r source/python_src/requirements.txt
          echo "PYTHONPATH=$RUNNER_TEMP/pydeps:${PYTHONPATH:-}" >> "$GITHUB_ENV"

      # Builds difxio (no gsl) from DiFX main and appends PKG_CONFIG_PATH to
      # $GITHUB_ENV for the later configure step. See the script for details.
      - name: Build difxio from DiFX source (no gsl)
        run: bash source/bash_src/ci-build-difxio.sh

      # disable test for bdist build, just ship it...though this has embedded python interpreter enabled by default
      - name: Configure (distribution build)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_INSTALL_PREFIX=$PWD/install \
            -DHOPS_BDIST_LICENSE_COMPAT_ONLY=ON \
            -DHOPS_USE_DIFXIO=ON \
            -DHOPS_USE_PYBIND11=ON \
            -DHOPS_ENABLE_DEBUG_MSG=OFF \
            -DHOPS_ENABLE_TEST=OFF

      - name: Build (distribution)
        run: cmake --build build --config $BUILD_TYPE --parallel 4

      - name: Install (distribution)
        run: cmake --install build

      # rename hops-<version>-<arch>.tar.gz to identify the OS + python version
      # see hops-build-binary-dist.sh, e.g.
      # hops-4.0.0-x86_64-ubuntu-22.04-python3.10.tar.gz
      - name: Package and tag with OS + python version
        working-directory: build
        run: |
          cpack -G TGZ
          . /etc/os-release
          OS_TAG="${ID}-${VERSION_ID}"
          PY_TAG="python$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          shopt -s nullglob
          pkgs=( hops-*.tar.gz )
          [ "${#pkgs[@]}" -gt 0 ] || { echo "cpack produced no tarball"; exit 1; }
          for pkg in "${pkgs[@]}"; do
            base="$(basename "${pkg%.tar.gz}")"
            mv "$pkg" "$GITHUB_WORKSPACE/dist/${base}-${OS_TAG}-${PY_TAG}.tar.gz"
          done
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hops-binary-dist-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
