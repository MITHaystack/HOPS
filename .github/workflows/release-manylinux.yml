name: Release (manylinux portable)

# Portable, broad-compatibility release built inside the manylinux_2_28 container
# (AlmaLinux 8 base, glibc 2.28) so the binaries run on a wide range of distros.
#
# Two shippable artifacts (bring-your-own-Python model, see project memory):
#   * minimal     - no-embed (HOPS_USE_PYBIND11=OFF, no interpreter at build): NO
#                   libpython is linked. Ships the C++ matplot++ plotter AND the
#                   libpython-free subprocess backend + pure-python control/plot
#                   packages, so the SAME binaries additionally do default
#                   matplotlib plotting + .py control by shelling out to the USER's
#                   python3 (+ numpy/matplotlib) when present. A single,
#                   non-ABI-locked binary set. tag: -manylinux_2_28-nopython
#   * multipython - the minimal binaries PLUS the pybind11 extension modules
#                   (pyMHO_*) compiled for EVERY supported CPython minor, all
#                   co-located in lib/python3/site-packages. The modules carry the
#                   SOABI tag (pyMHO_*.cpython-3X-...so) and link no libpython, so
#                   the user's own python3 (3.8-3.14) imports the matching one
#                   automatically so we have one relocatable tarball, no per-minor tarball
#                   but no embedded/ABI-locked apps. tag: -manylinux_2_28-multipython
#
# Internally the per-minor modules come from the `bindings` matrix job (one build
# per /opt/python/cpXY); the `bundle` job overlays them onto the `minimal` tree.
# We do NOT ship per-minor EMBEDDED apps: users who need in-process python plug-in
# operators build from source (the embedded interpreter is ABI-locked to one minor version)
#
# A v* tag attaches the tarballs to the Release; workflow_dispatch just uploads
# them as artifacts (dry run).

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
  COMPAT_TAG: manylinux_2_28          # portability label used in artifact names

jobs:
  # ---------------------------------------------------------------- minimal ---
  # No-embed: built with NO python interpreter at all (HOPS_USE_PYBIND11=OFF), so
  # NO libpython is linked. The subprocess backend is still compiled in and the
  # pure-python hops_control / hops_visualization packages are still staged (both
  # are interpreter-independent at build time), so the SAME binaries additionally
  # do default matplotlib plotting + .py control whenever the END user has a
  # python3 (+ numpy/matplotlib) on PATH otherwise they fall back to the C++
  # matplot++ plotter. A single, non-ABI-locked artifact.
  minimal:
    name: minimal (no-libpython)
    runs-on: ubuntu-22.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      DIFXROOT: ${{ github.workspace }}/difx-install
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: dnf -y install git make autoconf automake libtool pkgconfig cmake wget

      - name: Build difxio (no gsl)
        run: bash source/bash_src/ci-build-difxio.sh

      - name: Configure / build / install (no python)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DHOPS_BDIST_LICENSE_COMPAT_ONLY=ON \
            -DHOPS_USE_DIFXIO=ON \
            -DHOPS_USE_PYBIND11=OFF \
            -DHOPS_ENABLE_TEST=OFF \
            -DHOPS_ENABLE_DEBUG_MSG=OFF
          cmake --build build --parallel 4
          cmake --install build

      # Prove the shipped apps carry no libpython (DT_NEEDED), so they are not
      # ABI-locked to any CPython minor.
      - name: Assert no libpython linked
        run: |
          status=0
          for app in fourfit4 fplot4; do
            bin="install/bin/${app}"
            if [ ! -x "$bin" ]; then
              echo "ERROR: $bin not found / not executable"; status=1; continue
            fi
            echo "== ldd $app =="
            ldd "$bin" || true
            if ldd "$bin" | grep -qi 'libpython'; then
              echo "ERROR: $app links libpython in a no-embed build!"; status=1
            else
              echo "OK: $app has no libpython dependency"
            fi
          done
          exit $status

      - name: Package
        working-directory: build
        run: |
          cpack -G TGZ
          shopt -s nullglob
          mkdir -p "$GITHUB_WORKSPACE/dist"
          pkgs=( hops-*.tar.gz )
          [ "${#pkgs[@]}" -gt 0 ] || { echo "cpack produced no tarball"; exit 1; }
          for pkg in "${pkgs[@]}"; do
            base="$(basename "${pkg%.tar.gz}")"
            mv "$pkg" "$GITHUB_WORKSPACE/dist/${base}-${COMPAT_TAG}-nopython.tar.gz"
          done
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hops-${{ env.COMPAT_TAG }}-nopython
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true

  # --------------------------------------------------------------- bindings ---
  # Build the pybind11 extension modules (pyMHO_*) once per CPython minor. We only
  # HARVEST the per-minor modules (+ the version-independent pure-python packages)
  # here; the relocatable apps/libs come from the no-embed `minimal` build. The
  # modules are SOABI-tagged (pyMHO_*.cpython-3X-*.so) and link no libpython, so
  # every minor's modules coexist in one dir and the user's interpreter selects
  # its match. The `bundle` job overlays these onto the minimal tree.
  bindings:
    name: bindings (${{ matrix.py }})
    runs-on: ubuntu-22.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    strategy:
      fail-fast: false
      matrix:
        # CPython minors to support. Keep this in sync with what manylinux_2_28
        # actually ships under /opt/python (a missing one fails its leg, which
        # blocks the bundle (never ship an incomplete set).
        py: [ cp39, cp310, cp311, cp312, cp313, cp314 ]
    env:
      DIFXROOT: ${{ github.workspace }}/difx-install
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: dnf -y install git make autoconf automake libtool pkgconfig cmake wget

      - name: Build difxio (no gsl)
        run: bash source/bash_src/ci-build-difxio.sh

      - name: Configure / build / install (python ${{ matrix.py }})
        run: |
          PYBIN="/opt/python/${{ matrix.py }}-${{ matrix.py }}/bin/python"
          test -x "$PYBIN" || { echo "interpreter $PYBIN not found in image"; exit 1; }
          # Pin every FindPython variant so pybind11 builds against this exact minor.
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DHOPS_BDIST_LICENSE_COMPAT_ONLY=ON \
            -DHOPS_USE_DIFXIO=ON \
            -DHOPS_USE_PYBIND11=ON \
            -DHOPS_ENABLE_EMBEDDED_PYTHON=OFF \
            -DPython_EXECUTABLE="$PYBIN" \
            -DPython3_EXECUTABLE="$PYBIN" \
            -DPYTHON_EXECUTABLE="$PYBIN" \
            -DHOPS_ENABLE_TEST=OFF \
            -DHOPS_ENABLE_DEBUG_MSG=OFF
          cmake --build build --parallel 4
          cmake --install build

      # The modules must not link libpython (they resolve Python symbols from the
      # importing interpreter); that property is what lets all minors coexist.
      - name: Assert modules carry no libpython
        run: |
          shopt -s nullglob
          mods=( install/lib/python3/site-packages/pyMHO_*.so )
          [ "${#mods[@]}" -gt 0 ] || { echo "ERROR: no pyMHO_* modules were built"; exit 1; }
          status=0
          for so in "${mods[@]}"; do
            echo "== ldd $(basename "$so") =="
            if ldd "$so" | grep -qi libpython; then
              echo "ERROR: $(basename "$so") links libpython"; status=1
            fi
          done
          exit $status

      - name: Stage python payload (modules + pure-python packages)
        run: |
          mkdir -p payload
          cp -a install/lib/python3/site-packages/. payload/
          echo "== staged payload =="; ls -1 payload

      - name: Upload per-minor python payload
        uses: actions/upload-artifact@v4
        with:
          name: pybind-${{ matrix.py }}
          path: payload
          if-no-files-found: error

  # ----------------------------------------------------------------- bundle ---
  # Assemble ONE relocatable tarball: the no-embed apps/libs/pure-python packages
  # from `minimal`, plus every minor's pybind11 modules co-located in
  # lib/python3/site-packages. No build here, just download + overlay + re-tar.
  bundle:
    name: bundle (no-embed apps + multi-minor bindings)
    needs: [ minimal, bindings ]
    runs-on: ubuntu-22.04
    steps:
      - name: Download no-embed base tarball
        uses: actions/download-artifact@v4
        with:
          name: hops-${{ env.COMPAT_TAG }}-nopython
          path: base

      - name: Download per-minor python payloads
        uses: actions/download-artifact@v4
        with:
          pattern: pybind-*
          path: payloads

      - name: Assemble multi-minor bundle
        run: |
          set -euo pipefail
          shopt -s nullglob

          base_tgz="$(find base -name '*.tar.gz' | head -n1)"
          [ -n "$base_tgz" ] || { echo "ERROR: no base tarball found"; exit 1; }
          mkdir -p stage && tar -xzf "$base_tgz" -C stage

          # cpack's TGZ has a single top-level dir: hops-<version>-<arch>
          root="$(find stage -mindepth 1 -maxdepth 1 -type d | head -n1)"
          [ -n "$root" ] || { echo "ERROR: unexpected base tarball layout"; exit 1; }
          sitedir="$root/lib/python3/site-packages"
          mkdir -p "$sitedir"

          # Overlay each minor's payload. SOABI-tagged .so have unique names (no
          # clobber); the pure-python packages are identical across minors.
          count=0
          for d in payloads/*/; do
            echo "overlaying $d"
            cp -a "$d". "$sitedir"/
            ls "$d"pyMHO_Containers.cpython-*.so >/dev/null 2>&1 \
              || { echo "ERROR: payload $d has no pyMHO_Containers module"; exit 1; }
            count=$((count + 1))
          done
          [ "$count" -gt 0 ] || { echo "ERROR: no binding payloads downloaded"; exit 1; }

          echo "== bundled $count minor(s) =="
          ls -1 "$sitedir"/pyMHO_Containers.cpython-*.so

          base_name="$(basename "$root")"
          mkdir -p dist
          tar -czf "dist/${base_name}-${COMPAT_TAG}-multipython.tar.gz" -C stage "$base_name"
          ls -l dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hops-${{ env.COMPAT_TAG }}-multipython
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
